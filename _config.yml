# GitHub Pages 사용자 사이트 — 저장소 이름이 `<사용자명>.github.io`라 main 루트가 그대로 웹이 된다.
#
# **앱마다 폴더 하나**를 갖고, 그 안에 그 앱이 공개해야 하는 문서를 둔다(`however/`가 첫 번째다).
# 루트는 앱 목록일 뿐 어느 한 앱의 것이 아니다 — 앱이 늘어도 자리를 다투지 않게 하려는 것이다.
# 앱을 더할 때는 폴더를 하나 만들고 루트 목록에 한 줄을 더한다.
#
# 앱 소스는 각자의 비공개 저장소에 있고, 이 저장소는 공개돼야만 하는 문서만 갖는다.
title: Jung
description: Apps for iPhone

# 주소는 파일이 놓인 자리가 아니라 각 문서의 `permalink`가 정한다 — 폴더를 옮겨도
# 주소가 저절로 따라가지 않으니, 문서를 옮길 때는 front matter도 함께 본다.
#
# 사용자 사이트라 baseurl은 비어 있는 것이 맞다 — 프로젝트 사이트였다면 `/저장소이름`이 필요했다.
# 테마를 두는 이유는 앱에서 곧장 열리는 페이지이기 때문이다(없으면 스타일 없는 맨 HTML이 나온다).
theme: jekyll-theme-minimal
